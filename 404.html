<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      var pathSegmentsToKeep = 1;
      var location = window.location;
      var route = location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var base = location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var search = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';
      location.replace(
        location.protocol + '//' + location.hostname +
        (location.port ? ':' + location.port : '') +
        base + '/?/' + route.replace(/&/g, '~and~') + search + location.hash
      );
    </script>
  </head>
  <body></body>
</html>
