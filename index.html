  <body>
    <div id="root"></div>
    <script>
      (function restoreGitHubPagesRoute() {
        var redirect = sessionStorage.getRedirect;
        delete sessionStorage.getRedirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
          return;
        }

        if (location.search[1] === '/') {
          var decoded = location.search.slice(1).split('&').map(function (part) {
            return part.replace(/~and~/g, '&');
          });
          var route = decoded[0];
          var base = '/thduongkinh/';
          history.replaceState(null, null, base + route + location.hash);
        }
      })();
    </script>
